name: Practice Workflow

on:
  workflow_dispatch:

jobs:
  job_check:
    runs-on: ubuntu-latest

    outputs:
      job_check_status: ${{ steps.check.outputs.status }}

    steps:
        - name: TruffleHog OSS
          uses: trufflesecurity/trufflehog@v3.99.8

        - name: Checkout source
          id: check-source
          uses: actions/checkout@v7.0.1

        - name: Check Readme file
          id: check
          run: |
            ls -la
            test -f README.md
            echo "status=success" >> $GITHUB_OUTPUT 

        - name: show
          run: echo ${{ steps.check.outputs.status }}
       
  job_build:
    runs-on: ubuntu-latest

    outputs:
      job_build_status: ${{steps.output.outputs.status}}
    
    steps:
        - name: TruffleHog OSS
          uses: trufflesecurity/trufflehog@v3.99.8
    
        - name: output
          id: output
          run: echo "status=success" >> $GITHUB_OUTPUT 

  job_deploy:
    runs-on: ubuntu-latest
    needs: [job_check, job_build]

    steps:
        - name: TruffleHog OSS
          uses: trufflesecurity/trufflehog@v3.99.8
 
        - name: Show status job_check
          run: echo ${{ needs.job_check.outputs.job_check_status }}
        
        - name: Show status job_build
          run: echo ${{ needs.job_build.outputs.job_build_status }}
        
        - name: Send mail
          uses: dawidd6/action-send-mail@v23
          with:
            server_address: smtp.gmail.com
            server_port: 465
            secure: true
            username: tonyteofpt1@gmail.com
            password: yycjldjeclopvzbo
            subject: Github Actions job result
            to: tonyteofpt1@gmail.com
            from: 'Tony Teo <tonyteofpt1@gmail.com>'
            body: Build job of ${{github.repository}} completed successfully!
            html_body: file://README.html

  